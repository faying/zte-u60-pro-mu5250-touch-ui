<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>CHILL</title><meta name="description" content="线路与出口"></head>
<body>
  <!-- 状态（1A 第一优先级）。阶段一硬约束：旧二进制的 SC_CORE 只产出纯文字
       （运行中/已停止），没有配套的颜色 class（源码 src/htmlmain.c 未产出
       SC_CLS_CORE）。完整的 15 状态语义（过热/低内存/规则缺失等，颜色+符号）
       要读 /tmp/chill.state，那需要重编译，属阶段三（DESIGN.md §4）。
       这里只把已有的三项信息（核心状态/出口/速率）提到最上面，按 1A 层级放置。 -->
  <div class="card">
    <div class="title">{{SC_CORE}} · {{SC_CHAIN}}</div>
    <div class="sc-hint">{{SC_SPEED}}</div>
  </div>

  <!-- 模式 + 测延迟（1A 第二层级：能改的东西）。
       不单独显示「模式：规则」文字——按钮高亮（SC_CLS_*）已经代表当前模式，
       重复显示是冗余，1A 的参考版式里也没有这一行。
       重启按钮已去掉：chill.sh 的 run 循环自己监督子进程重启（T2），
       触屏手动重启和它冲突，交由设备端逻辑处理。 -->
  <div class="card">
    <div class="title">模式</div>
    <div class="sc-row">
      <a href="act:scmode:rule" class="sc-btn {{SC_CLS_RULE}}">规则</a><a href="act:scmode:global" class="sc-btn {{SC_CLS_GLOBAL}}">全局</a><a href="act:scmode:direct" class="sc-btn {{SC_CLS_DIRECT}}">直连</a>
    </div>
    <div class="sc-row">
      <a href="act:scdelay" class="sc-btn sc-full {{SC_DELAY_CLS}}">{{SC_DELAY_LBL}}</a>
    </div>
  </div>

  <!-- 组（1A 第三层级） -->
  <div class="card">
    <div class="title">查看组 <span class="sc-hint">● = 流量正走这条</span></div>
    <div class="sc-grps">{{SC_GROUPLIST}}</div>
  </div>

  <!-- 节点列表（1A 第四层级，可滚动） -->
  <div class="card">
    <div class="title">节点 · {{SC_GROUP}}</div>
    {{SC_NODELIST}}
  </div>

  <!-- 末尾：流量与连接明细，一行小字，不用卡片
       （1A 原则 5：纯展示分组不用卡片；视觉分隔线留给 DT2 处理双主题配色）。 -->
  <div class="sc-hint">流量 {{SC_TRAFFIC}} · 连接 {{SC_CONNS}}（{{SC_CONNSPLIT}}）</div>

  <!-- 事件历史行（决定 3A）阶段一做不到：旧二进制不读 /data/chill/events.log，
       没有对应令牌；硬造一个未知令牌会被原样显示成字面花括号文字，是倒退，不是留空。
       需要阶段三重编译支持，见 DESIGN.md 第 4 节「触屏·阶段三」。 -->

  <!-- 2026-09-17：「切回原厂界面」（act:exitstock）已从本页移除。
       实测确认它是近乎不可逆的动作：确认后 DevUI 进程直接 exit(0)（这台设备
       没有合成器，屏幕渲染由单一进程独占 DRM framebuffer，做不成浮窗叠加），
       2 秒后启动原厂 UI（devui_restore_stock() 默认跑
       /etc/init.d/zte_topsw_devui start），且不改 rc.local。回到 DevUI 唯一的
       路是 SSH 手动重启或整机重启——原厂界面自己不知道 DevUI 存在，没有回去的
       按钮。这个代价和它跟 CHILL 毫不相关的性质，不该靠两段式确认加一句提示
       文字就摆在这，且当前整个 App 没有任何全局设置/关于页面能安放它——
       需要先有那个页面才谈得上给它一个合适的入口。act:exitstock 这个动作
       本身与 devui_restore_stock() 都还在（htmlmain.c / chill.c），随时可以
       重新接上，只是本页不再提供入口。 -->
</body>
</html>
